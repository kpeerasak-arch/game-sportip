<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Literacy Quest By Dr.pkkp</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #50E3C2;
      --accent: #FF6B6B;
      --warning: #F5A623;
      --bg: #EEF2F5;
      --card-bg: #FFFFFF;
      --text: #2C3E50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    #game-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      position: relative;
      min-height: 550px;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #4A90E2, #67B26F);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-stats {
      display: flex;
      gap: 15px;
      align-items: center;
      font-size: 0.95rem;
    }

    .btn-sound {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    .screen {
      display: none;
      padding: 25px;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    .home-title {
      font-size: 2rem;
      color: var(--primary);
      margin-bottom: 10px;
      text-align: center;
    }

    .home-subtitle {
      color: #666;
      margin-bottom: 25px;
      text-align: center;
    }

    .btn-main {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 35px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4);
      text-decoration: none;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      background: #357ABD;
    }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      width: 100%;
      margin-top: 15px;
    }

    .stage-card {
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .stage-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
      background: #E2E8F0;
    }

    .stage-card:not(.locked):hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .stage-number {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
    }

    .stage-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 5px 0;
    }

    .post-test-banner {
      width: 100%;
      margin: 20px 0 10px 0;
      padding: 15px;
      background: #FFF5F5;
      border: 2px dashed var(--accent);
      border-radius: 15px;
      text-align: center;
      animation: pulse 2s infinite;
    }

    .btn-post-test {
      display: inline-block;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      transition: transform 0.2s;
    }

    .btn-post-test:hover {
      transform: scale(1.03);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.01); }
      100% { transform: scale(1); }
    }

    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #E2E8F0;
      border-radius: 5px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--secondary);
      transition: width 0.3s;
    }

    .question-box {
      width: 100%;
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 20px;
      background: #F0F4F8;
      padding: 15px 20px;
      border-radius: 12px;
      border-left: 5px solid var(--primary);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      width: 100%;
    }

    @media (min-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      background: white;
      border: 2px solid #E2E8F0;
      padding: 12px 18px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn:hover:not([disabled]) {
      border-color: var(--primary);
      background: #F8FAFC;
    }

    .option-btn.correct {
      background: #D4EDDA !important;
      border-color: #28A745 !important;
      color: #155724;
    }

    .option-btn.wrong {
      background: #F8D7DA !important;
      border-color: #DC3545 !important;
      color: #721C24;
    }

    .explanation {
      margin-top: 15px;
      padding: 12px;
      background: #FFF3CD;
      border-radius: 10px;
      font-size: 0.9rem;
      width: 100%;
      display: none;
    }

    .btn-next {
      margin-top: 20px;
      display: none;
    }

    .badge-icon {
      font-size: 4rem;
      margin-bottom: 15px;
    }

    .score-text {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <header>
      <div class="header-title">🎮 Digital Literacy Quest By Dr.pkkp 24/8/26</div>
      <div class="header-stats">
        <span>คะแนนรวม: <strong id="total-score">0</strong></span>
        <button class="btn-sound" id="toggle-sound">🔊 เปิดเสียง</button>
      </div>
    </header>

    <!-- หน้าแรก -->
    <div id="screen-home" class="screen active">
      <div class="badge-icon">🌐</div>
      <h1 class="home-title">Digital Literacy Quest</h1>
      <p class="home-subtitle">การผจญภัยเพื่อวัดระดับสมรรถนะดิจิทัล (Digital Competency)</p>
      <button class="btn-main" onclick="showScreen('screen-stages')">เข้าสู่การเดินทาง</button>
    </div>

    <!-- หน้าเลือกด่าน -->
    <div id="screen-stages" class="screen">
      <h2 style="margin-bottom: 10px;">เลือกด่านการเรียนรู้</h2>
      
      <!-- พื้นที่แสดงปุ่มแบบทดสอบหลังเรียน -->
      <div id="post-test-area"></div>

      <div class="stage-grid" id="stage-grid"></div>
      <button class="btn-main" style="margin-top: 20px; background: #6C757D;" onclick="showScreen('screen-home')">หน้าหลัก</button>
    </div>

    <!-- หน้าทำแบบทดสอบ -->
    <div id="screen-quiz" class="screen">
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="question-box" id="question-text">คำถามจะปรากฏที่นี่</div>
      <div class="options-grid" id="options-container"></div>
      <div class="explanation" id="explanation-box"></div>
      <button class="btn-main btn-next" id="btn-next" onclick="nextQuestion()">ข้อถัดไป ➔</button>
    </div>

    <!-- หน้าสรุปผลด่าน -->
    <div id="screen-result" class="screen">
      <div class="badge-icon" id="result-badge">🏆</div>
      <h2>จบด่านการเรียนรู้!</h2>
      <div class="score-text" id="result-score">คะแนนของคุณ: 0/3</div>
      <p id="result-status" style="margin-bottom: 20px;"></p>
      <div style="display: flex; gap: 10px;">
        <button class="btn-main" onclick="showScreen('screen-stages')">เลือกด่านอื่น</button>
        <button class="btn-main" id="btn-retry" style="background: var(--warning);" onclick="retryStage()">ลองอีกครั้ง</button>
      </div>
    </div>
  </div>

  <script>
    const gameData = [
      {
        id: 1,
        title: "Hardware & Mobile",
        questions: [
          { q: "หน่วยความจำใดเก็บข้อมูลชั่วคราวขณะเปิดโปรแกรม หากปิดเครื่องข้อมูลจะหาย?", options: ["SSD", "RAM", "ROM", "MicroSD"], correct: 1, exp: "RAM เป็นหน่วยความจำชั่วคราว (Volatile Memory)" },
          { q: "วิธีชาร์จแบตเตอรี่สมาร์ตโฟน (Lithium-ion) ที่ดีที่สุดเพื่อยืดอายุใช้งาน?", options: ["ใช้จน 0% ค่อยชาร์จ", "คุมแบตช่วง 20%-80%", "เสียบข้ามคืนบนฟูก", "แช่ตู้เย็นก่อนชาร์จ"], correct: 1, exp: "การรักษาแบตเตอรี่ให้อยู่ช่วง 20%-80% และหลีกเลี่ยงความร้อนจะยืดอายุแบตได้ดีที่สุด" },
          { q: "หากต้องการโน้ตบุ๊กที่เปิดเครื่องไวและโหลดแอปเร็ว ควรใช้ไดรฟ์ประเภทใด?", options: ["Floppy Disk", "HDD", "SSD", "Magnetic Tape"], correct: 2, exp: "SSD อ่าน-เขียนข้อมูลด้วยชิปแฟลช ซึ่งเร็วกว่า HDD หลายเท่า" }
        ]
      },
      {
        id: 2,
        title: "Software & OS",
        questions: [
          { q: "โปรแกรมใดทำหน้าที่เป็นตัวกลางจัดการทรัพยากรเครื่องระหว่างฮาร์ดแวร์กับผู้ใช้?", options: ["Operating System (OS)", "Web Browser", "Application Software", "Utility"], correct: 0, exp: "OS (เช่น Windows, macOS, Android) ทำหน้าที่ควบคุมเครื่อง" },
          { q: "ข้อใดจัดเป็น Application Software ทั้งหมด?", options: ["Windows 11, iOS", "Excel, Canva, Photoshop", "macOS, Android", "Linux, Safari"], correct: 1, exp: "Excel, Canva และ Photoshop คือซอฟต์แวร์ประยุกต์ใช้งานเฉพาะทาง" },
          { q: "ระบบปฏิบัติการ Open-source ที่เปิดให้พัฒนาดัดแปลงได้อย่างอิสระคือข้อใด?", options: ["iOS", "Windows", "Linux", "macOS"], correct: 2, exp: "Linux เป็นระบบปฏิบัติการแบบ Open-source" }
        ]
      },
      {
        id: 3,
        title: "Device Security",
        questions: [
          { q: "การยืนยันตัวตนแบบ Biometrics ใช้อะไรในการตรวจสอบ?", options: ["รหัสผ่าน 6 หลัก", "ลายนิ้วมือ / ใบหน้า", "วันเกิด", "คำถามกันลืม"], correct: 1, exp: "Biometrics ใช้เอกลักษณ์ทางกายภาพ เช่น ลายนิ้วมือ หรือการสแกนใบหน้า" },
          { q: "การอัปเดต Security Patch สม่ำเสมอมีประโยชน์หลักอย่างไร?", options: ["อุดช่องโหว่ความปลอดภัย", "ลบไฟล์เก่าอัตโนมัติ", "เพิ่มความจุ Hard Disk", "เพิ่มสเปกเครื่อง"], correct: 0, exp: "Patch ช่วยอุดช่องโหว่ป้องกันการโจมตีจากแฮกเกอร์" },
          { q: "กฎการสำรองข้อมูลแบบ 3-2-1 ข้อใดถูกต้อง?", options: ["เก็บ 3 สำเนา ในสื่อ 2 ชนิด นอกสถานที่ 1 แห่ง", "แฟลชไดรฟ์ 3 อัน ส่งเมล 2 ครั้ง", "สำรองทุก 3 วัน ครั้งละ 2 ชม.", "สำรองไว้ 3 เครื่อง"], correct: 0, exp: "กฎ 3-2-1 เป็นมาตรฐานการสำรองข้อมูลเพื่อความปลอดภัยสูงสุด" }
        ]
      },
      {
        id: 4,
        title: "Document & Presentation",
        questions: [
          { q: "ฟังก์ชันใดใน Word Processing ใช้สร้างสารบัญอัตโนมัติได้อย่างแม่นยำ?", options: ["พิมพ์เอง", "Heading Styles", "Page Margin", "Text Box"], correct: 1, exp: "การใช้ Heading Styles ช่วยให้โปรแกรมดึงหัวข้อมาสร้างสารบัญได้ทันที" },
          { q: "หลักการสำคัญของ Visual Storytelling ในการนำเสนอคือข้อใด?", options: ["อัดข้อความเต็มสไลด์", "เน้นภาพ/กราฟิก ลดตัวอักษร", "ใส่ Effect เคลื่อนไหวทุกจุด", "ใช้ฟอนต์หลากสี"], correct: 1, exp: "Visual Storytelling เน้นใช้ภาพสื่อสารประเด็นสำคัญ" },
          { q: "หากต้องการกำหนดฟอนต์และโลโก้ให้อยู่ตำแหน่งเดียวกันทุกสไลด์ ควรแก้ที่ส่วนใด?", options: ["Layout View", "Page Setup", "Slide Master", "Animation Pane"], correct: 2, exp: "Slide Master คือแม่แบบหลักที่ควบคุมดีไซน์ทั้งสไลด์" }
        ]
      },
      {
        id: 5,
        title: "Data & Spreadsheet",
        questions: [
          { q: "หากต้องการรวมผลตามเงื่อนไขหลายประการใน Spreadsheet ควรใช้สูตรใด?", options: ["=SUM()", "=SUMIFS()", "=COUNT()", "=AVERAGE()"], correct: 1, exp: "SUMIFS ใช้คำนวณผลรวมตามเงื่อนไขที่กำหนด" },
          { q: "เครื่องมือใดเหมาะสำหรับการสรุป จัดกลุ่ม และหมุนมุมมองข้อมูลจำนวนมาก?", options: ["Data Validation", "Conditional Formatting", "Pivot Table", "VLOOKUP"], correct: 2, exp: "Pivot Table ช่วยสรุปข้อมูลปริมาณมากได้อย่างรวดเร็ว" },
          { q: "การเปรียบเทียบสัดส่วนของข้อมูลทั้งหมด (องค์ประกอบ 100%) ควรใช้แผนภูมิใด?", options: ["Line Chart", "Pie Chart", "Scatter Plot", "Radar Chart"], correct: 1, exp: "Pie Chart เหมาะสำหรับแสดงสัดส่วนเปอร์เซ็นต์ของภาพรวม" }
        ]
      },
      {
        id: 6,
        title: "Database Basics",
        questions: [
          { q: "ข้อใดคือความต่างสำคัญระหว่าง Spreadsheet กับ Relational Database?", options: ["Spreadsheet เก็บได้เยอะกว่า", "Database เชื่อมโยงหลายตารางได้ดีกว่า", "Spreadsheet ใส่ตัวเลขไม่ได้", "Database ค้นไม่ได้"], correct: 1, exp: "Database เน้นการจัดเก็บข้อมูลเชิงสัมพันธ์และลดความซ้ำซ้อน" },
          { q: "คุณสมบัติสำคัญของ Primary Key (คีย์หลัก) คือข้อใด?", options: ["ค่าต้องไม่ซ้ำและห้ามเป็นค่าว่าง", "ต้องเป็นตัวเลขเท่านั้น", "เปลี่ยนค่าได้ตลอด", "มีได้มากกว่า 10 คีย์"], correct: 0, exp: "Primary Key ต้องระบุแถวข้อมูลได้อย่างไม่ซ้ำซ้อน (Unique & Not Null)" },
          { q: "การออกแบบฐานข้อมูลแยกตาราง มีวัตถุประสงค์หลักเพื่ออะไร?", options: ["เพื่อให้พิมพ์ยากขึ้น", "ลดความซ้ำซ้อนของข้อมูล", "เพิ่มขนาดไฟล์", "ทำให้ระบบช้าลง"], correct: 1, exp: "การทํา Normalization ช่วยลดความซ้ำซ้อนของข้อมูล" }
        ]
      },
      {
        id: 7,
        title: "Internet & Network",
        questions: [
          { q: "เมื่อเชื่อมต่อ Wi-Fi สาธารณะ ควรปฏิบัติตามข้อใดเพื่อความปลอดภัย?", options: ["ทำธุรกรรมเงินทันที", "เปิดใช้งาน VPN เข้ารหัสข้อมูล", "ปิดไฟร์วอลล์", "แชร์โฟลเดอร์ Public"], correct: 1, exp: "VPN ช่วยเข้ารหัสข้อมูลป้องกันการดักจับบนเครือข่ายสาธารณะ" },
          { q: "ข้อดีหลักของบริการ Cloud Computing คือข้อใด?", options: ["เข้าถึงไฟล์ได้ทุกอุปกรณ์ผ่านเน็ต", "ทำงานได้โดยไม่ต้องใช้อินเทอร์เน็ต", "ไม่ต้องใช้นามสกุลไฟล์", "ป้องกันไวรัส 100%"], correct: 0, exp: "Cloud เพิ่มความยืดหยุ่นและการทำงานร่วมกันออนไลน์" },
          { q: "IP Address เปรียบเสมือนสิ่งใดในระบบอินเทอร์เน็ต?", options: ["ชื่อผู้ใช้โซเชียล", "บ้านเลขที่ระบุที่อยู่อุปกรณ์", "รหัสผ่านเปิดเครื่อง", "ยี่ห้ออุปกรณ์"], correct: 1, exp: "IP Address เป็นหมายเลขระบุตัวตนอุปกรณ์บนเครือข่าย" }
        ]
      },
      {
        id: 8,
        title: "Digital Citizenship",
        questions: [
          { q: "ข้อใดจัดว่าเป็น Digital Footprint (รอยเท้าดิจิทัล)?", options: ["รอยเท้าบนคีย์บอร์ด", "ประวัติโพสต์/ค้นหาบนออนไลน์", "ขนาดหน้าจอสมาร์ตโฟน", "ความเร็วเน็ต"], correct: 1, exp: "Digital Footprint คือร่องรอยกิจกรรมทั้งหมดที่เราทำไว้บนออนไลน์" },
          { q: "เมื่อพบเห็นการ Cyberbullying ควรรับมืออย่างไร?", options: ["ร่วมด่าทอ", "ไม่ส่งต่อ บล็อก และ Report", "พิมพ์หยาบคายตอบกลับ", "ลบแอปทิ้งเงียบๆ"], correct: 1, exp: "การหยุดแชร์ บล็อก และรายงานความผิดช่วยระงับการคุกคาม" },
          { q: "สัญลักษณ์ Creative Commons รูปแบบ CC BY หมายความว่าอย่างไร?", options: ["ห้ามนำไปใช้เด็ดขาด", "ใช้ได้แต่ต้องอ้างอิงแหล่งที่มา", "เอาไปขายได้โดยไม่บอกใคร", "ดัดแปลงได้แต่ห้ามเผยแพร่"], correct: 1, exp: "CC BY อนุญาตให้ใช้ได้โดยต้องระบุเครดิตผู้สร้างสรรค์" }
        ]
      },
      {
        id: 9,
        title: "Cyber Security",
        questions: [
          { q: "อีเมลส่งมาจาก support@paypa1-security.com หลอกให้คลิกลิงก์แก้ไขรหัสผ่าน จัดเป็นภัยแบบใด?", options: ["Phishing", "Ransomware", "DDoS", "Spyware"], correct: 0, exp: "Phishing คือการปลอมแปลงหลอกเอาข้อมูลสำคัญ" },
          { q: "การตั้งรหัสผ่าน (Strong Password) ที่ปลอดภัยที่สุดควรเป็นอย่างไร?", options: ["12345678", "วันเกิดตนเอง", "ยาว 12+ ตัวอักษร ผสมอักษร/ตัวเลข/สัญลักษณ์", "ชื่อสัตว์เลี้ยง"], correct: 2, exp: "ความยาวและความหลากหลายของตัวอักษรทำให้สุ่มรหัสผ่านได้ยาก" },
          { q: "การเปิดใช้งาน 2FA เพิ่มความปลอดภัยอย่างไร?", options: ["เพิ่มความเร็วล็อกอิน", "ต้องยืนยันตัวตน 2 ขั้นตอน", "ป้องกันเครื่องร้อน", "บล็อกโฆษณา"], correct: 1, exp: "2FA ช่วยป้องกันการเข้าถึงแม้รหัสผ่านหลักจะหลุดรอดไป" }
        ]
      }
    ];

    let currentStageIndex = 0;
    let currentQuestionIndex = 0;
    let scoreInStage = 0;
    let soundEnabled = true;
    let userProgress = JSON.parse(localStorage.getItem('dq_progress')) || { unlockedStage: 1, totalScore: 0 };

    // เพิ่มการโหลดไฟล์เสียงฉลอง tada.mp3
    const tadaAudio = new Audio('https://kpeerasak-arch.github.io/game-sportip/img/tada.mp3');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (!soundEnabled) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'click') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      }
    }

    document.getElementById('toggle-sound').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      document.getElementById('toggle-sound').innerText = soundEnabled ? "🔊 เปิดเสียง" : "🔇 ปิดเสียง";
    });

    function updateHeaderScore() {
      document.getElementById('total-score').innerText = userProgress.totalScore;
    }

    function showScreen(screenId) {
      playSound('click');
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-stages') {
        renderStages();
      }
      updateHeaderScore();
    }

    function renderStages() {
      const grid = document.getElementById('stage-grid');
      const postTestArea = document.getElementById('post-test-area');
      grid.innerHTML = '';
      
      // แสดงปุ่มแบบทดสอบหลังเรียน และเล่นเสียง tada.mp3
      if (userProgress.unlockedStage > gameData.length) {
        postTestArea.innerHTML = `
          <div class="post-test-banner">
            <p style="margin-bottom: 10px; font-weight: 600; color: #D32F2F;">🎉 ยินดีด้วย! คุณเรียนรู้ครบทุกด่านเรียบร้อยแล้ว</p>
            <a href="https://kpeerasak-arch.github.io/dlexam/" target="_blank" class="btn-post-test">
              📝 ทำแบบทดสอบหลังเรียน (Post-Test) ➔
            </a>
          </div>
        `;
        
        // เล่นเสียง tada เมื่อเปิดเสียงไว้
        if (soundEnabled) {
          tadaAudio.currentTime = 0;
          tadaAudio.play().catch(e => console.log('Audio autoplay prevented:', e));
        }
      } else {
        postTestArea.innerHTML = '';
      }

      gameData.forEach((stage, idx) => {
        const isLocked = stage.id > userProgress.unlockedStage;
        const card = document.createElement('div');
        card.className = `stage-card ${isLocked ? 'locked' : ''}`;
        card.innerHTML = `
          <div class="stage-number">STAGE ${stage.id}</div>
          <div class="stage-title">${stage.title}</div>
          <div>${isLocked ? '🔒 ล็อกอยู่' : '⭐ พร้อมเล่น'}</div>
        `;
        if (!isLocked) {
          card.onclick = () => startStage(idx);
        }
        grid.appendChild(card);
      });
    }

    function startStage(index) {
      currentStageIndex = index;
      currentQuestionIndex = 0;
      scoreInStage = 0;
      showScreen('screen-quiz');
      loadQuestion();
    }

    function loadQuestion() {
      const stage = gameData[currentStageIndex];
      const q = stage.questions[currentQuestionIndex];

      const progressPercent = ((currentQuestionIndex) / stage.questions.length) * 100;
      document.getElementById('progress-bar').style.width = `${progressPercent}%`;

      document.getElementById('question-text').innerText = `[ข้อที่ ${currentQuestionIndex + 1}/${stage.questions.length}] ${q.q}`;
      document.getElementById('explanation-box').style.display = 'none';
      document.getElementById('btn-next').style.display = 'none';

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
        btn.onclick = () => selectOption(idx, q.correct, q.exp);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIdx, correctIdx, exp) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === correctIdx) {
        buttons[selectedIdx].classList.add('correct');
        playSound('correct');
        scoreInStage++;
      } else {
        buttons[selectedIdx].classList.add('wrong');
        buttons[correctIdx].classList.add('correct');
        playSound('wrong');
      }

      const expBox = document.getElementById('explanation-box');
      expBox.innerText = `💡 คำอธิบาย: ${exp}`;
      expBox.style.display = 'block';

      document.getElementById('btn-next').style.display = 'inline-block';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      const stage = gameData[currentStageIndex];
      if (currentQuestionIndex < stage.questions.length) {
        loadQuestion();
      } else {
        finishStage();
      }
    }

    function finishStage() {
      showScreen('screen-result');
      const stage = gameData[currentStageIndex];
      const passed = (scoreInStage / stage.questions.length) >= 0.66;

      document.getElementById('result-score').innerText = `คะแนนของคุณ: ${scoreInStage} / ${stage.questions.length}`;

      if (passed) {
        document.getElementById('result-badge').innerText = '🏆';
        document.getElementById('result-status').innerText = 'ยินดีด้วย! คุณผ่านด่านนี้สำเร็จ';
        document.getElementById('result-status').style.color = '#28A745';

        if (stage.id === userProgress.unlockedStage) {
          userProgress.unlockedStage++;
        }
        userProgress.totalScore += scoreInStage * 100;
        localStorage.setItem('dq_progress', JSON.stringify(userProgress));
        document.getElementById('btn-retry').style.display = 'none';
      } else {
        document.getElementById('result-badge').innerText = '❌';
        document.getElementById('result-status').innerText = 'ยังไม่ผ่านด่าน (ต้องได้คะแนน 80% ขึ้นไป)';
        document.getElementById('result-status').style.color = '#DC3545';
        document.getElementById('btn-retry').style.display = 'inline-block';
      }
    }

    function retryStage() {
      startStage(currentStageIndex);
    }

    updateHeaderScore();
  </script>
</body>
</html>
